<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Riffle</title>
  <meta name="description" content="Riffle: a daily word game in English and French. Three words were shuffled together like a deck of cards. Pull them back apart.">
  <meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16141c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="side">
      <button class="icon-btn" id="btn-help" type="button" data-i18n-aria="howToPlay">?</button>
    </div>
    <div class="brand">
      <h1>Riffle</h1>
      <p class="credit"><span data-i18n="madeWith">Made with ❤️ by</span> <a href="https://mco.dev/">Marc</a></p>
    </div>
    <div class="side right">
      <select id="lang" class="lang" data-i18n-aria="language">
        <option value="en">EN</option>
        <option value="fr">FR</option>
      </select>
      <button class="icon-btn" id="btn-stats" type="button" data-i18n-aria="statistics">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 20V10h3v10H4Zm6.5 0V4h3v16h-3ZM17 20v-7h3v7h-3Z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="meta">
      <span id="label"></span>
      <span class="dot">·</span>
      <span><span data-i18n="par">Par</span> <b>3</b></span>
      <span class="dot">·</span>
      <span id="count"></span>
    </div>

    <div id="strip" class="strip" role="group" data-i18n-aria="strip"></div>

    <div class="entry">
      <div id="word" class="word" aria-live="polite"></div>
      <div id="msg" class="msg" aria-live="polite"></div>
    </div>

    <div class="controls">
      <button type="button" class="btn" id="btn-clear" data-i18n="clear">Clear</button>
      <button type="button" class="btn" id="btn-back" data-i18n-aria="backspace">⌫</button>
      <button type="button" class="btn primary" id="btn-enter" data-i18n="enter">Enter</button>
    </div>

    <ul id="found" class="found" data-i18n-aria="yourWords"></ul>

    <div class="aux">
      <button type="button" class="link" id="btn-hint"></button>
      <button type="button" class="link" id="btn-reset" data-i18n="startOver">Start over</button>
      <button type="button" class="link" id="btn-mode"></button>
    </div>

    <section id="done" class="done" hidden>
      <h2 id="done-title"></h2>
      <p id="done-sub"></p>
      <div id="secret" class="secret"></div>
      <pre id="share-text" class="share-text"></pre>
      <div class="done-actions">
        <button type="button" class="btn primary" id="btn-share" data-i18n="share">Share</button>
        <button type="button" class="btn" id="btn-next"></button>
      </div>
      <p class="next-daily" id="next-daily"></p>
    </section>
  </main>

  <dialog id="help" class="sheet">
    <form method="dialog"><button class="close" data-i18n-aria="close">×</button></form>
    <div id="help-body"></div>
    <form method="dialog"><button class="btn primary wide" data-i18n="play">Play</button></form>
  </dialog>

  <dialog id="stats" class="sheet">
    <form method="dialog"><button class="close" data-i18n-aria="close">×</button></form>
    <h2 data-i18n="statistics">Statistics</h2>
    <div class="stat-row" id="stat-row"></div>
    <h3 data-i18n="wordsUsed">Words used to solve</h3>
    <div id="dist" class="dist"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
